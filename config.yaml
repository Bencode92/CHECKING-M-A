# ============================================================
# CHECKING M&A — Configuration  (focus : INTÉRIM / travail temporaire)
# ============================================================

# --- Cible commune à tous les scrapers ---
cible:
  # Préfixes NAF retenus (78 = activités liées à l'emploi)
  naf_prefixes:
    - "78.20"    # Activités des agences de travail temporaire (ETT)
    - "78.10"    # Activités des agences de placement de main-d'œuvre
    - "78.30"    # Autre mise à disposition de ressources humaines
  # Mots-clés pour les sources sans code NAF fiable (BODACC, Actify)
  mots_cles:
    - "travail temporaire"
    - "intérim"
    - "interim"
    - "agence d'emploi"
    - "mise à disposition de personnel"
    - "mise à disposition de salariés"
    - "portage salarial"
    - "placement de main"

# --- Pappers API ---
pappers:
  api_token: "VOTRE_TOKEN_ICI"   # Créer sur https://www.pappers.fr/api

  # Canal 1 : Chasse succession (dirigeant senior, agence saine)
  succession:
    age_dirigeant_min: 55
    age_dirigeant_max: 80
    entreprise_cessee: false
    procedure_collective: false
    date_creation_max: "01-01-2010"
    # CA d'une agence d'intérim = heures facturées (marge brute ≈ 15-25 %)
    chiffre_affaires_min: 1000000
    chiffre_affaires_max: 30000000
    par_page: 100

  # Canal 2 : Distressed (procédure collective en cours)
  distressed:
    procedure_collective: true
    entreprise_cessee: false
    par_page: 100

  codes_naf:
    - "78.20Z"   # Agences de travail temporaire
    - "78.10Z"   # Placement de main-d'œuvre
    - "78.30Z"   # Autre mise à disposition de RH

  # Départements cibles (vide = toute la France)
  departements: []

  # Régions cibles (vide = toutes)
  regions: []

# --- BODACC ---
bodacc:
  types_procedures:
    - "Jugement d'ouverture de redressement judiciaire"
    - "Jugement de plan de cession"
    - "Jugement d'ouverture de liquidation judiciaire"
  jours_lookback: 90
  # Enrichissement SIRENE (recherche-entreprises.api.gouv.fr) : NAF, effectif, création
  enrichir_sirene: true

# --- Actify ---
actify:
  url_entreprises: "https://actify.fr/entreprises-liquidation-judiciaire/"
  max_pages: 10
  # Les annonces sont filtrées par cible.mots_cles (titre + activité + description)

# --- Notifications ---
notifications:
  email: ""
  telegram_bot_token: ""
  telegram_chat_id: ""
