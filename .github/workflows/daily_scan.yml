name: Daily Acquisition Pipeline
on:
  workflow_dispatch:
    inputs:
      run_pappers:
        description: 'Run Pappers extraction'
        type: boolean
        default: false
      run_actify:
        description: 'Run Actify scraper'
        type: boolean
        default: true
      run_bodacc:
        description: 'Run BODACC monitor'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright
        if: ${{ github.event.inputs.run_actify == 'true' }}
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Create data directory
        run: mkdir -p scrapers/data data

      - name: Run BODACC Monitor
        if: ${{ github.event.inputs.run_bodacc == 'true' }}
        run: |
          cd scrapers
          python bodacc_monitor.py --days 30 --max 500

      - name: Run Actify Scraper
        if: ${{ github.event.inputs.run_actify == 'true' }}
        run: |
          cd scrapers
          python actify_scraper.py --max-pages 23 --max-details 500

      - name: Run Pappers Hunter
        if: ${{ github.event.inputs.run_pappers == 'true' && env.PAPPERS_API_TOKEN != '' }}
        env:
          PAPPERS_API_TOKEN: ${{ secrets.PAPPERS_API_TOKEN }}
        run: |
          cd scrapers
          python pappers_hunter.py --token "$PAPPERS_API_TOKEN" --canal both --max 500

      - name: Copy data to root for dashboard
        run: |
          cp -f scrapers/data/*.json data/ 2>/dev/null || true

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ scrapers/data/
          git diff --staged --quiet || git commit -m "📊 Daily scan $(date -u +%Y-%m-%d)"
          git push
